services:
  ai-incident-investigator:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-incident-investigator:2.0.0
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      AI_INVESTIGATOR_API_TOKEN: ${AI_INVESTIGATOR_API_TOKEN:?Set a 32+ character token in the environment}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
